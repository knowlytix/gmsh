# GMS-172: post-mirror-push smoke test.
#
# Triggers after every release force-push to knowlytix/gmsh main.
# Structure:
#   1. `smoke` (single job, ~3-4 min): install the pinned
#      knowlytix-harness wheel (from PyPI for final releases, from
#      the internal RC bundle on knowlytix/GMS for pre-releases),
#      run `knowlytix-smoke`.  Gates the matrix.
#   2. `notebook` (matrix, 18 parallel, ~10 min wall):  needs smoke
#      to succeed; each job installs the same wheels + runs one
#      notebook from the classifier's clean set.
#
# The single smoke job gives fast failure detection at the install
# boundary and a prominent top-level status check in the UI.  The
# matrix jobs re-install because each runs on a fresh runner; pip
# cache amortizes most of the cost.
#
# ch04 (train_gms training loop) and ch05/ch06 (LLM) are excluded
# from the matrix — see scripts/execute_tutorials.py classifier.
#
# SECURITY — DO NOT WEAKEN:
#   - Trigger is `push: branches: [main]` ONLY. No `pull_request`,
#     `pull_request_target`, or `workflow_run`. Each of those has
#     a secret-exposure path on public repos that this workflow
#     cannot tolerate.
#   - External-PR CI lives in `ci.yml` (GMS-154) as a separate
#     workflow file and MUST NOT reference `secrets.KNOWLYTIX_LICENSE_KEY`
#     or `secrets.GMS_RELEASE_DOWNLOAD_TOKEN`. Keeping the two
#     workflows disjoint is defense-in-depth.
#   - `KNOWLYTIX_LICENSE_KEY` is a trial-tier JWT with a CI-distinct
#     `customer_id` so a leak is traceable and revocable without
#     touching customer keys. Rotation runbook:
#     distribution/mirror_secret_rotation.md.
#   - `GMS_RELEASE_DOWNLOAD_TOKEN` is a fine-grained PAT, Contents:
#     Read on knowlytix/GMS only, 90-day expiry, revoked at public
#     flip. Same runbook.
#
# See public_mirror_plan.md §"Post-push smoke CI (mirror side)"
# for the full design rationale.

name: post-mirror-smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # -- Stage 1: single smoke gate (~3-4 min) -------------------------------
  smoke:
    name: Install + knowlytix-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Exposed to every step in this job. Masked automatically in logs
      # by GitHub Actions — never echo `$KNOWLYTIX_LICENSE_KEY` directly.
      KNOWLYTIX_LICENSE_KEY: ${{ secrets.KNOWLYTIX_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify license secret is wired (fail fast, log identity only)
        # Fails if the secret is missing before we burn time on pip.
        # Logs the decoded JWT `customer_id` + `tier` + `expires` claims
        # so a leak (or a misconfigured environment) is traceable to the
        # CI key vs. a customer key without ever printing the JWT body.
        # Claims are extracted client-side without signature verification
        # — this step is purely diagnostic; real verification happens
        # inside `knowlytix-smoke` via the license gate.
        #
        # Claim names match the payload schema in
        # `provisioning/provision.py::_build_payload`.
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys

          key = os.environ.get("KNOWLYTIX_LICENSE_KEY", "")
          if not key:
              print("::error::KNOWLYTIX_LICENSE_KEY secret is not set; cannot run post-mirror smoke")
              sys.exit(1)

          # Strip the product prefix if present (`gmsh_live_` → raw JWT).
          token = key.removeprefix("gmsh_live_")
          try:
              _hdr, payload_b64, _sig = token.split(".")
          except ValueError:
              print("::error::secret is not a JWT triplet — regenerate per mirror_secret_rotation.md")
              sys.exit(1)

          payload_b64 += "=" * (-len(payload_b64) % 4)
          try:
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
          except Exception as exc:
              print(f"::error::failed to decode JWT payload: {exc}")
              sys.exit(1)

          customer_id = payload.get("customer_id", "<missing-customer_id>")
          tier = payload.get("tier", "<missing-tier>")
          expires = payload.get("expires", "<missing-expires>")
          print(f"license_customer_id={customer_id} tier={tier} expires={expires}")
          PY

      - name: Determine install source from pinned version
        # Dual-path design:
        #   - Pre-release (`*-rc*`, `*-alpha*`, `*-beta*`): download the
        #     internal RC bundle `gms-internal-<tag>.zip` attached to
        #     the matching GitHub Release on the private `knowlytix/GMS`
        #     repo. Auth via `GMS_RELEASE_DOWNLOAD_TOKEN` (fine-grained
        #     PAT, `Contents: Read` scoped to `knowlytix/GMS` only).
        #   - Final release (`vX.Y.Z`): `pip install -r tutorials/requirements.txt`
        #     from real PyPI. Matches what external users experience.
        # The version pattern self-selects — no workflow edit needed at
        # Phase 6 / public flip. See public_mirror_plan.md §"Post-push
        # smoke CI (mirror side)".
        id: src
        run: |
          ver=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)*' tutorials/requirements.txt | head -1)
          if [[ -z "$ver" ]]; then
              echo "::error::could not parse version from tutorials/requirements.txt"
              exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "$ver" in
              *-rc*|*rc[0-9]*|*-alpha*|*-beta*)
                  echo "source=github-release" >> "$GITHUB_OUTPUT"
                  echo "pre-release $ver detected — will install from knowlytix/GMS release assets"
                  ;;
              *)
                  echo "source=pypi" >> "$GITHUB_OUTPUT"
                  echo "final release $ver detected — will install from PyPI"
                  ;;
          esac

      - name: Install from PyPI (final releases)
        if: steps.src.outputs.source == 'pypi'
        run: |
          python -m pip install -U pip
          python -m pip install -r tutorials/requirements.txt

      - name: Install from knowlytix/GMS release assets (pre-releases)
        if: steps.src.outputs.source == 'github-release'
        env:
          GH_TOKEN: ${{ secrets.GMS_RELEASE_DOWNLOAD_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
              echo "::error::GMS_RELEASE_DOWNLOAD_TOKEN is not set; cannot fetch pre-release assets"
              echo "::error::See distribution/mirror_secret_rotation.md §GMS_RELEASE_DOWNLOAD_TOKEN for provisioning"
              exit 1
          fi
          tag="v${{ steps.src.outputs.version }}"
          mkdir -p /tmp/rc-bundle
          # build-internal-rc.yml attaches a single `gms-internal-<tag>.zip`
          # asset containing core (Nuitka, platform-tagged) + doc/bench/harness
          # (pure-Python `py3-none-any`).
          if ! gh release download "$tag" \
              --repo knowlytix/GMS \
              --pattern "gms-internal-*.zip" \
              --dir /tmp/rc-bundle; then
              echo "::error::release $tag not found on knowlytix/GMS, or missing gms-internal-*.zip asset"
              echo "::error::likely cause: build-internal-rc.yml hasn't finished yet — wait for it, then re-push the mirror"
              exit 1
          fi
          unzip -q /tmp/rc-bundle/gms-internal-*.zip -d /tmp/rc-bundle/unpacked
          python -m pip install -U pip
          # Install the 4 knowlytix wheels by explicit path — pip resolves
          # their transitive deps (litellm, torch, pydantic, numpy, …)
          # from real PyPI normally.  Do NOT use --no-index: that cuts
          # pip off from PyPI and the transitive-dep resolution fails on
          # the first not-in-the-bundle package.
          python -m pip install \
              /tmp/rc-bundle/unpacked/knowlytix_core-*.whl \
              /tmp/rc-bundle/unpacked/knowlytix_doc-*.whl \
              /tmp/rc-bundle/unpacked/knowlytix_bench-*.whl \
              /tmp/rc-bundle/unpacked/knowlytix_harness-*.whl

      - name: Run knowlytix-smoke
        run: knowlytix-smoke

  # -- Stage 2: matrix-parallel notebook execution (~10 min wall) ---------
  notebook:
    # Gated on the smoke job passing.  Each matrix job re-installs the
    # wheels independently (fresh runner), then executes ONE notebook.
    # pip cache amortizes most of the install cost.
    #
    # `needs: smoke` ensures the 18 notebook jobs don't spin up if the
    # install or license gate is broken — you get the failure signal
    # once, not 18 times.
    name: ${{ matrix.notebook }}
    needs: smoke
    runs-on: ubuntu-24.04
    # 15 min per notebook covers the slowest clean notebook
    # (ch20 at ~11 min observed on rc10) plus fixed overhead (~3-4 min).
    timeout-minutes: 20
    strategy:
      # Don't cascade — we want each notebook's pass/fail independently.
      # A single failure shouldn't abort the others.
      fail-fast: false
      matrix:
        # The clean notebook set as classified by
        # scripts/execute_tutorials.py.  Kept in sync by
        # test_post_mirror_smoke_matrix_includes_clean_set in
        # tests/scripts/test_mirror_to_public.py.
        #
        # Excluded (deliberate):
        #   - ch04_building_ground_truth — training-heavy
        #     (`train_gms(epochs=500)`); 8-10 min even with
        #     pre-built stores.  Content is pedagogical training
        #     code, not install-path validation.
        #   - ch05_question_generation, ch06_geometric_judge —
        #     direct LLM calls via `get_llm()`; need a provider
        #     key not available in post-mirror-smoke's environment.
        notebook:
          - appF_training_diagnostics
          - ch01_agentic_testing_problem
          - ch02_gms_ground_truth
          - ch03_design_of_experiments
          - ch07_statistical_analysis
          - ch08_claims
          - ch09_verifiers
          - ch10_verdicts_failures
          - ch11_sut_abstraction
          - ch12_tool_gateway
          - ch13_policy_engine
          - ch14_environment_simulation
          - ch15_oracles
          - ch16_hallucination_detection
          - ch17_confidence_calibration
          - ch18_stateful_multiturn
          - ch19_multi_agent_cross_doc
          - ch20_governance_operations
    env:
      KNOWLYTIX_LICENSE_KEY: ${{ secrets.KNOWLYTIX_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # License-secret verify + install-source determination duplicated
      # from the smoke job because each matrix job runs on a fresh
      # runner with no state carried over.  Identical logic, same
      # failure modes.  See the smoke job's comments for the rationale.

      - name: Determine install source from pinned version
        id: src
        run: |
          ver=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)*' tutorials/requirements.txt | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "$ver" in
              *-rc*|*rc[0-9]*|*-alpha*|*-beta*)
                  echo "source=github-release" >> "$GITHUB_OUTPUT"
                  ;;
              *)
                  echo "source=pypi" >> "$GITHUB_OUTPUT"
                  ;;
          esac

      - name: Install from PyPI (final releases)
        if: steps.src.outputs.source == 'pypi'
        run: |
          python -m pip install -U pip
          python -m pip install -r tutorials/requirements.txt

      - name: Install from knowlytix/GMS release assets (pre-releases)
        if: steps.src.outputs.source == 'github-release'
        env:
          GH_TOKEN: ${{ secrets.GMS_RELEASE_DOWNLOAD_TOKEN }}
        run: |
          tag="v${{ steps.src.outputs.version }}"
          mkdir -p /tmp/rc-bundle
          gh release download "$tag" \
              --repo knowlytix/GMS \
              --pattern "gms-internal-*.zip" \
              --dir /tmp/rc-bundle
          unzip -q /tmp/rc-bundle/gms-internal-*.zip -d /tmp/rc-bundle/unpacked
          python -m pip install -U pip
          python -m pip install \
              /tmp/rc-bundle/unpacked/knowlytix_core-*.whl \
              /tmp/rc-bundle/unpacked/knowlytix_doc-*.whl \
              /tmp/rc-bundle/unpacked/knowlytix_bench-*.whl \
              /tmp/rc-bundle/unpacked/knowlytix_harness-*.whl

      - name: Install notebook-execution deps and register kernel
        run: |
          python -m pip install jupyter nbconvert ipykernel
          python -m ipykernel install --user --name gmsh-ci

      - name: Execute ${{ matrix.notebook }}
        # `--only clean` acts as a safety net: if the matrix list drifts
        # to include a notebook the classifier later tags as llm /
        # training-heavy, the job will report skipped rather than
        # hang/fail.  `--timeout 600` is the per-cell nbconvert timeout
        # (bumped from default 300 so ch03/ch20 analysis cells fit).
        run: |
          python scripts/execute_tutorials.py \
            --kernel gmsh-ci \
            --only clean \
            --timeout 600 \
            --notebook-dir tutorials/notebooks \
            --notebook ${{ matrix.notebook }} \
            --log-path /tmp/notebook-${{ matrix.notebook }}.md

      - name: Upload notebook log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.notebook }}
          path: /tmp/notebook-${{ matrix.notebook }}.md
          retention-days: 14
