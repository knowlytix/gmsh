# Scoped build configuration for the `knowlytix-benchmark` wheel
# ( scaffold; renamed from `finstructbench` in).
#
# Ships `knowlytix/benchmark/` — including the graph-based generators/scorers,
# the five bundled benchmark instances, and the store-based generators
# moved into `knowlytix/benchmark/eval/` by.
# moved the source tree from `finstructbench/` to `knowlytix/benchmark/`
# and retargeted force-include below.
#
# `GeneratedQuestion` at `knowlytix.benchmark.generators.base` is a public-API
# contract consumed by `knowlytix.harness.testing.bridge` (see CLAUDE.md).
# Don't rename.

[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "knowlytix-benchmark"
# Version is derived from the git tag (hatch-vcs) — single source of truth
# across all 4 wheels.  Build off a clean `vX.Y.Z[-rcN]` tag; an untagged
# commit yields a `…dev+g<sha>` local version that PyPI rejects (guardrail).
dynamic = ["version"]
description = "Benchmark for structured information retrieval from financial documents using graph-verifiable questions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
# See packaging/knowlytix-knowledge/pyproject.toml for the rationale — LICENSE lives at
# `../../LICENSE` (outside this pyproject's project dir), so PEP 639
# `license-files` is omitted and `force-include` places it into the wheel.
authors = [
    {name = "Agus Sudjianto"},
    {name = "Wingyan Lau"},
]
keywords = [
    "benchmark",
    "finance",
    "llm",
    "structured-retrieval",
    "knowledge-graph",
    "question-answering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Bare name — exact `==<vcs version>` pin injected at build time by the
    # custom metadata hook (see [tool.hatch.metadata.hooks.custom]).
    "knowlytix-core",
    "numpy>=1.24",
    "litellm>=1.40",
    "pydantic-settings>=2.0",
]

[project.scripts]
benchmark = "knowlytix.benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/knowlytix/gmsh"
Issues = "https://github.com/knowlytix/gmsh/issues"

# --- Version source (hatch-vcs) -----------------------------------------------
# This pyproject lives in packaging/<pkg>/, so point setuptools_scm's root two
# levels up at the repo root where .git lives.  All 4 wheels share this config
# → one git tag drives every version.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

# Inject exact knowlytix-* cross-dep pins (==<vcs version>) at build time.
[tool.hatch.metadata.hooks.custom]
path = "../_hatch_hooks/pin_cross_deps.py"

# --- Hatchling wheel layout ---------------------------------------------------
# `force-include` maps repo-root `knowlytix/benchmark/` into the wheel. The
# `instances/*.md` files plus the fixture `__init__.py` stubs are preserved
# so `importlib.resources` lookups for bundled benchmarks and smoke fixtures
# resolve post-install.

[tool.hatch.build.targets.wheel]
packages = []
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "**/tests",
    # Legacy standalone-repo pyproject — the scoped one under
    # packaging/knowlytix-benchmark/ is the source of truth for the wheel.
    "knowlytix/benchmark/pyproject.toml",
    # Per-run result artifacts — not part of the shipped package.
    "knowlytix/benchmark/results",
    # `generate_*` / `gen_*` scripts produced the committed instances;
    # they are build-time tools, not runtime API.
    "knowlytix/benchmark/instances/generate_*.py",
    "knowlytix/benchmark/instances/gen_*.py",
]

[tool.hatch.build.targets.wheel.force-include]
"../../knowlytix/benchmark" = "knowlytix/benchmark"
"../../LICENSE" = "knowlytix/benchmark/LICENSE"
# README content → METADATA via `project.readme`; see
# packaging/knowlytix-core/pyproject.toml for the rationale.

# No sdist target — see packaging/knowlytix-core/pyproject.toml for rationale.
