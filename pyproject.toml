[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowlytix-gmsh-dev"
version = "0.0.0-dev"
description = "Development environment for knowlytix-doc, -bench, -harness"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # knowlytix-core is not in this repo — ships from the commercial
    # private monorepo.  Install from the matching GitHub Release bundle
    # or from PyPI once published.
    "knowlytix-core>=0.1.0-rc4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    "mypy",
    "jupyterlab>=4",
]

[tool.hatch.build]
# Editable-install mode covers the full knowlytix namespace at the repo
# root.  Real wheels build from packaging/<pkg>/pyproject.toml — those
# scoped configs are the source of truth for published artifacts.
dev-mode-dirs = ["knowlytix"]
